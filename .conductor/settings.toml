"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./scripts/setup.sh"
run_mode = "nonconcurrent"

[scripts.run.dev]
command = "pnpm db:start && ./scripts/with-local-supabase.sh pnpm dev --host 0.0.0.0 --port ${CONDUCTOR_PORT:-3000}"
default = true
icon = "play"

[scripts.run.test]
command = "pnpm test"
icon = "test-tube"

[scripts.run.validate]
command = "pnpm db:start && pnpm validate"
icon = "badge-check"

[scripts.run.database]
command = "pnpm db:start"
icon = "database"
