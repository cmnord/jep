"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./scripts/setup.sh"
run_mode = "nonconcurrent"

[scripts.run.dev]
command = "npm run db:start && ./scripts/with-local-supabase.sh npm run dev -- --host 0.0.0.0 --port ${CONDUCTOR_PORT:-3000}"
default = true
icon = "play"

[scripts.run.test]
command = "npm run test"
icon = "test-tube"

[scripts.run.validate]
command = "npm run db:start && npm run validate"
icon = "badge-check"

[scripts.run.database]
command = "npm run db:start"
icon = "database"
