name: Test
on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      - name: 💅 Format check
        run: npm run format:check

      - name: 🔬 Lint
        run: npm run lint

      - name: 🔎 Type check
        run: npm run typecheck
        # React Router typegen loads the Vite config, which makes Varlock
        # validate the complete schema. Typechecking never uses these values,
        # so non-secret placeholders are sufficient.
        env:
          SESSION_SECRET: ${{ github.sha }}
          SUPABASE_ANON_KEY: "typecheck-only-key"
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.sha }}

      - name: ⚡ Run vitest
        run: npm run test -- --run

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      - name: 🛠 Setup Database
        # GitHub's ubuntu-latest image provides a running Docker Engine.
        # db:start only starts the kong and postgrest containers.
        run: npm run db:start

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🎭 Playwright run
        run: npm run test:e2e:run
        env:
          CI: "true"
          SESSION_SECRET: ${{ github.sha }}

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
